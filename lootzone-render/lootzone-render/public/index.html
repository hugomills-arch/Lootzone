const $=s=>document.querySelector(s),cv=$('#c'),g=cv.getContext('2d');let VW,VH;
function rs(){cv.width=VW=innerWidth;cv.height=VH=innerHeight}rs();addEventListener('resize',rs);
const W=2400,H=1800;function rng(s){return()=>(s=(s*1664525+1013904223)>>>0)/4294967296}
/* weapons: [rate,mag,reload,spread,pellets,dmg,range,recoil] */
const T={pistol:[320,12,1100,.012,1,26,650,.12],smg:[80,30,1500,.035,1,15,520,.06],ar:[115,30,1900,.02,1,22,900,.09],sg:[800,6,2300,.11,7,14,380,.4],sn:[1300,4,2600,.002,1,95,1500,.5],hv:[70,80,3200,.045,1,12,700,.05]};
const EF={civil:{r:1.9,m:.35,d:1.25,s:1.4,t:'1863 Civil War'},ww1:{r:1.35,m:.55,d:1.1,s:1.25,t:'1916 Great War'},ww2:{r:1.05,m:.9,d:1,s:1.05,t:'1940s WW2'},mod:{r:1,m:1,d:1,s:1,t:'2000s Modern'}};
const WN={civil:{pistol:'Colt Revolver',smg:'Cavalry Carbine',ar:'Springfield Rifle',sg:'Coach Gun',sn:'Whitworth Rifle',hv:'Gatling Gun'},ww1:{pistol:'Webley',smg:'Bergmann MP18',ar:'Lee-Enfield',sg:'Trench Gun',sn:'Mauser Sniper',hv:'Lewis Gun'},ww2:{pistol:'M1911',smg:'Thompson',ar:'M1 Garand',sg:'Winchester 97',sn:'Mosin Sniper',hv:'MG42'},mod:{pistol:'Pistol',smg:'SMG',ar:'Assault Rifle',sg:'Shotgun',sn:'Sniper Rifle',hv:'Minigun'}};
const PR={smg:250,ar:400,sg:350,sn:600,hv:800},RAR=['Common','Uncommon','Rare','Epic','Legendary'],RC=['#b0b7bf','#4cd964','#3fa9ff','#b45cff','#ffb627'],RM=[1,1.1,1.22,1.36,1.5],RW=[45,28,15,8,4];
function mkW(id,r){const[e,ro]=id.split(':'),t=T[ro],f=EF[e],m=Math.max(2,Math.round(t[1]*f.m));return{id,n:WN[e][ro],role:ro,rate:t[0]*f.r,mag:m,mx:m,rlt:1500,spread:t[3]*f.s,pel:t[4],dmg:t[5]*f.d,range:t[6],rec:t[7],res:m*4,next:0,rl:0,r:r|0}}
const CL={assault:{hp:130,sp:175,rad:14,pri:'ar',d:'Balanced rifleman. Can sprint.'},sniper:{hp:90,sp:190,rad:12,pri:'sn',d:'Fragile. Long range, huge damage.'},medic:{hp:100,sp:180,rad:13,pri:'smg',d:'Heals nearby allies. SMG.'},tank:{hp:260,sp:115,rad:21,pri:'hv',d:'Armoured heavy gunner. ONE per team.'}};
const MAPS=[{n:'Gettysburg 1863',era:'civil',g:'#5d7a3a',g2:'#6f8f48',w:'#8b6b45',t:'fence',seed:3,cr:4,tr:34},{n:'The Somme 1916',era:'ww1',g:'#5a4a35',g2:'#473a2a',w:'#6b5a3f',t:'sand',seed:5,cr:46,tr:22},{n:'Stalingrad 1942',era:'ww2',g:'#868a8e',g2:'#a6aaae',w:'#6d6560',t:'brick',seed:9,cr:16,tr:30},{n:'Normandy 1944',era:'ww2',g:'#c2b280',g2:'#b0a070',w:'#6f6a5a',t:'sand',seed:13,cr:14,tr:18},{n:'Fallujah 2004',era:'mod',g:'#b39b6b',g2:'#a08a5c',w:'#9a8a72',t:'brick',seed:17,cr:6,tr:26}];
const DF={easy:{acc:.13,rt:950,hp:80,sp:80,n:4},medium:{acc:.28,rt:620,hp:110,sp:105,n:6},hard:{acc:.5,rt:380,hp:150,sp:135,n:8}};
let walls=[],chests=[],bg=null,mi=0,era='mod';
function free(x,y,r){for(const w of walls)if(x>w[0]-r&&x<w[0]+w[2]+r&&y>w[1]-r&&y<w[1]+w[3]+r)return false;return true}
function buildMap(i){mi=i;const M=MAPS[i];era=M.era;const R=rng(M.seed*7+1);walls=[[-40,-40,W+80,40],[-40,H,W+80,40],[-40,0,40,H],[W,0,40,H]];
for(let k=0;k<M.tr;k++){const h=R()<.5,l=100+R()*240,x=60+R()*(W-360),y=60+R()*(H-360);if(Math.abs(x-W/2)<0&&0)continue;walls.push([x,y,h?l:34,h?34:l])}
if(M.n[0]==='N')walls.push([0,H-150,W,150]);chests=[];while(chests.length<18){const x=100+R()*(W-200),y=100+R()*(H-200);if(free(x,y,40))chests.push({x,y,open:0})}
bg=document.createElement('canvas');bg.width=W;bg.height=H;const b=bg.getContext('2d');b.fillStyle=M.g;b.fillRect(0,0,W,H);
for(let k=0;k<5200;k++){b.fillStyle=R()<.5?M.g2:'rgba(0,0,0,.12)';const z=1+R()*2.5;b.fillRect(R()*W,R()*H,z,z)}
for(let k=0;k<M.cr;k++){const x=R()*W,y=R()*H,r=22+R()*38;b.fillStyle='rgba(0,0,0,.28)';b.beginPath();b.arc(x,y,r+6,0,7);b.fill();b.fillStyle=M.g2;b.beginPath();b.arc(x,y,r,0,7);b.fill();b.fillStyle='rgba(0,0,0,.35)';b.beginPath();b.arc(x+3,y+3,r*.7,0,7);b.fill()}
if(M.era==='ww1'){b.strokeStyle='#2c2218';b.lineWidth=26;for(const yy of[420,1300]){b.beginPath();b.moveTo(0,yy);for(let x=0;x<=W;x+=60)b.lineTo(x,yy+Math.sin(x/90)*18);b.stroke()}}
if(M.n[0]==='N'){b.fillStyle='#3f6f96';b.fillRect(0,H-150,W,150);b.fillStyle='#dfe9ef';for(let x=0;x<W;x+=70)b.fillRect(x,H-150+Math.sin(x)*8,40,4)}
for(const w of walls.slice(4).filter(w=>!(w[2]===W&&w[3]===150))){const[x,y,ww,hh]=w;b.fillStyle='rgba(0,0,0,.38)';b.fillRect(x+7,y+9,ww,hh);b.fillStyle=M.w;b.fillRect(x,y,ww,hh);b.fillStyle='rgba(255,255,255,.16)';b.fillRect(x,y,ww,4);b.fillStyle='rgba(0,0,0,.25)';b.fillRect(x,y+hh-5,ww,5);b.strokeStyle='rgba(0,0,0,.35)';b.lineWidth=1;b.beginPath();
if(M.t==='brick'){for(let yy=y+9;yy<y+hh;yy+=9){b.moveTo(x,yy);b.lineTo(x+ww,yy)}for(let yy=y,o=0;yy<y+hh;yy+=9,o++)for(let xx=x+(o%2)*9;xx<x+ww;xx+=18){b.moveTo(xx,yy);b.lineTo(xx,yy+9)}}
else if(M.t==='fence'){const v=ww>hh;for(let k=0;k<(v?ww:hh);k+=8){v?(b.moveTo(x+k,y),b.lineTo(x+k,y+hh)):(b.moveTo(x,y+k),b.lineTo(x+ww,y+k))}}
else{const v=ww>hh;for(let k=0;k<(v?ww:hh);k+=14){v?b.rect(x+k,y+2,12,hh-4):b.rect(x+2,y+k,ww-4,12)}}b.stroke()}}
/* ------- state ------- */
let P={n:'',xp:0,wins:0,kills:0,own:[],armor:0,kits:0,sec:'pistol'},uid=null,db=null,usr=null,room0=null,net=null,peers=[],myPeer=null,tab='play';
let phase='menu',mode='tdm',diff='medium',cls='assault',tm='A',me={x:300,y:300,a:0},hp=100,sh=0,alive=false,lastHit=0,respawnAt=0,kills=0,deaths=0,inv=[],sel=0,bloom=0,moving=false,sprint=false,mouse={x:0,y:0,d:0},keys={};
let cam={x:0,y:0},tracers=[],feed=[],flashes=[],pops=[],hitm=0,dmgDir=0,openT=0,bots=[],now=0,vt=0,vote=-1,result=null,dmgTo={},sv=0,matchId=0;
const AK={arrowup:'w',arrowdown:'s',arrowleft:'a',arrowright:'d'};let rat=0,wat=0;
let parts=[],shake=0,lastImp=0,AC,NB,stam=100,exh=false,stamHold=0,pick=[],sm={},sdt=.016;
const WTW={pistol:1,smg:2,ar:3,sg:3.2,sn:3.6,hv:6.5},PC={food:'#d98b3a',water:'#4aa3e8',ammo:'#c9d36a',bandage:'#f2f2f2',armor:'#9aa5b0',medkit:'#ff5c5c'};
const wload=()=>{let t=0;inv.forEach((w,i)=>t+=(WTW[w.role]||2)*(i===sel?1:.4));return t};
const cur=()=>inv[sel],secId=()=>era+':'+(P.own.includes(era+':'+P.sec)?P.sec:'pistol'),enemy=p=>mode==='ffa'||p.presence.tm!==tm;
function note(t,c){feed.unshift({t:now,s:t,c:c||'#e8edf2'});feed.length=Math.min(feed.length,6)}
function save(){clearTimeout(sv);sv=setTimeout(()=>{try{db&&uid&&db.doc('players/'+uid).set({...P,n:P.n||'Rookie'})}catch(e){}},800)}
function xp(n,why){P.xp+=n;pops.unshift({t:now,s:'+'+n+' XP  '+why});pops.length=Math.min(pops.length,4);save()}
function ac(){if(!AC){try{AC=new AudioContext();NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function noise(dur,f,fe,vol,type,q){const A=ac();if(!A)return;const t=A.currentTime,o=A.createBufferSource(),fl=A.createBiquadFilter(),gn=A.createGain();o.buffer=NB;fl.type=type||'lowpass';fl.Q.value=q||1;fl.frequency.setValueAtTime(f,t);fl.frequency.exponentialRampToValueAtTime(Math.max(40,fe||f),t+dur);gn.gain.setValueAtTime(Math.max(.001,vol),t);gn.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(fl);fl.connect(gn);gn.connect(A.destination);o.start(t);o.stop(t+dur+.05)}
function tone(f,fe,dur,vol,type){const A=ac();if(!A)return;const t=A.currentTime,o=A.createOscillator(),gn=A.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,fe),t+dur);gn.gain.setValueAtTime(Math.max(.001,vol),t);gn.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(gn);gn.connect(A.destination);o.start(t);o.stop(t+dur+.05)}
const snd=(f,d,v)=>tone(f,f*.5,d,v||.05,'sawtooth');
function sfxShot(r,k){if(k<=.02)return;if(r==='sn'){noise(.45,6000,300,.5*k);noise(.9,900,120,.25*k);tone(110,30,.5,.35*k)}else if(r==='sg'){noise(.32,5000,200,.55*k);tone(90,30,.3,.4*k)}else if(r==='hv'){noise(.09,7000,900,.3*k);tone(150,50,.08,.22*k,'square')}else if(r==='pistol'){noise(.14,6500,700,.35*k);tone(180,60,.1,.25*k)}else{noise(.16,7000,600,.38*k);tone(140,45,.12,.28*k,'triangle')}}
function sfxHurt(){tone(240,90,.14,.16,'square');noise(.12,900,200,.25)}
function sfxDie(k){tone(220,35,.9,.28*(k||1),'sawtooth');noise(.5,1200,100,.3*(k||1))}
function sfxClick(){tone(1400,700,.03,.1,'square');noise(.03,5000,2000,.1,'highpass')}
function impact(x,y,a,k){const wl=k===1||k===3;for(let i=0;i<(wl?6:8);i++){const q=Math.random()*6.28,sp=40+Math.random()*160;parts.push({x,y,vx:Math.cos(q)*sp,vy:Math.sin(q)*sp,t:now,l:wl?260+Math.random()*200:380,c:wl?(Math.random()<.5?'#ffd27a':MAPS[mi].w):'#b3141b',s:wl?2:2.6})}
if(wl)parts.push({x,y,vx:0,vy:-10,t:now,l:500,c:'rgba(200,190,170,.35)',s:9});if(now-lastImp<35||(k===3&&Math.random()<.5))return;lastImp=now;if(wl){noise(.07,3500,1200,.16,'bandpass',3);tone(2200,900,.05,.05,'triangle')}else{noise(.1,500,150,.3);tone(1600,1000,.04,.12,'square')}}
function sfxHead(){tone(1800,1200,.14,.2,'triangle');noise(.06,6000,3000,.2,'highpass')}
const pop=t=>{pops.unshift({t:now,s:t});pops.length=Math.min(pops.length,4)};
function isHead(px,py,x,y,c,s,rad,w){return w.pel===1&&Math.abs((px-x)*s-(py-y)*c)<rad*.5+1}
function buildPick(){const R=rng(MAPS[mi].seed*13+5),ty=['food','food','food','water','water','water','ammo','ammo','ammo','ammo','ammo','bandage','bandage','armor','medkit'],ro=['pistol','smg','ar','sg','sn','hv'];pick=[];while(pick.length<44){const x=90+R()*(W-180),y=90+R()*(H-180);if(!free(x,y,24))continue;pick.push({x,y,t:ty[~~(R()*ty.length)],role:ro[~~(R()*ro.length)],gone:-1e9})}}
function take(it){const mh=CL[cls].hp;let m='';
if(it.t==='food'){if(rat>=4)return false;rat++;m='Ration stored ('+rat+'/4)  press F'}
else if(it.t==='bandage'){if(hp>=mh)return false;hp=Math.min(mh,hp+15);m='+15 HP  Bandage'}
else if(it.t==='water'){if(wat>=4)return false;wat++;m='Water stored ('+wat+'/4)  press G'}
else if(it.t==='armor'){if(sh>=100)return false;sh=Math.min(100,sh+25);m='+25 Shield  Armour plate'}
else if(it.t==='medkit'){if(P.kits>=5)return false;P.kits++;save();m='+1 Medkit'}
else{const w=inv.find(x=>x.role===it.role);if(!w||w.res>=w.mx*8)return false;w.res+=w.mx*2;m='+'+w.mx*2+' ammo  '+w.n}
pop(m);tone(500,760,.12,.08,'triangle');return true}
function useItem(k){if(!alive)return;const mh=CL[cls].hp;if(k==='f'){if(rat<1)return pop('No rations');if(hp>=mh)return pop('Health already full');rat--;hp=Math.min(mh,hp+30);pop('+30 HP  Ration');tone(300,420,.15,.08,'triangle')}else{if(wat<1)return pop('No water');if(stam>=98)return pop('Stamina already full');wat--;stam=Math.min(100,stam+50);if(stam>=25)exh=false;pop('+50 Stamina  Water');tone(700,500,.15,.08,'sine')}}
function shell(x,y,a){parts.push({x:x+Math.cos(a)*10,y:y+Math.sin(a)*10,vx:Math.cos(a+1.6)*(60+Math.random()*50),vy:Math.sin(a+1.6)*(60+Math.random()*50),t:now,l:650,c:'#d4a64a',s:2.4})}
/* ------- account + UI ------- */
async function initAcct(){try{if(window.claude){room0=await claude.use('room');usr=await claude.use('user');db=await claude.use('db');if(usr&&db){uid=await usr.id();if(uid){const s=await db.doc('players/'+uid).get();if(s.exists)Object.assign(P,s.data())}}}}catch(e){}ui()}
const tankTaken=()=>peers.some(p=>!p.isMe&&p.presence.tm===tm&&p.presence.cls==='tank'&&p.presence.al!==undefined);
function ui(){const m=$('#menu');let h='<h1>LOOTZONE</h1><p>Battles of history. Pick a class, vote on a battlefield, crack chests, earn XP.</p><div class=row>'+['play','shop','board'].map(t=>'<button class="'+(tab===t?'on':'')+'" onclick="tab=\''+t+'\';ui()">'+t.toUpperCase()+'</button>').join('')+'<b style="margin:0 10px;color:#ffb627">'+(P.xp|0)+' XP</b></div>';
if(tab==='play'){h+='<p>'+(uid?'Signed in with your claude.ai account. Progress and leaderboard rank are saved to it.':'Guest mode: progress is not saved (sign in to claude.ai to keep XP).')+' Passwords and emails are never stored here; your claude.ai login is the account.</p><div class=row><input id=nm maxlength=12 placeholder="Callsign" value="'+(P.n||'')+'"></div><h2>Class</h2><div class=row>'+Object.keys(CL).map(k=>'<div class=card style="border-color:'+(cls===k?'#ffb627':'#2a3a48')+'"><b>'+k.toUpperCase()+'</b><br>HP '+CL[k].hp+'<br>'+CL[k].d+'<br><button onclick="cls=\''+k+'\';ui()">Select</button></div>').join('')+'</div>';
h+='<h2>Online Servers</h2><div class=row><div class=card style="width:250px"><b>TEAM SERVER</b><br>Team Deathmatch. Two teams, one tank each. First team to 30.<br><button class="go srv" onclick="start(\'team\')">JOIN TEAM SERVER</button></div><div class=card style="width:250px"><b>FREE-FOR-ALL SERVER</b><br>Everyone for themselves. First to 15 kills.<br><button class="go srv" onclick="start(\'ffa\')">JOIN FFA SERVER</button></div></div><h2>Practice vs Bots</h2><div class=row><select id=md><option value=tdm>Team Deathmatch</option><option value=ffa>Free For All</option></select><select id=df><option value=easy>Bots: Easy</option><option value=medium selected>Bots: Medium</option><option value=hard>Bots: Hard</option></select><button class=go onclick="start(\'prac\')">START PRACTICE</button></div><p>WASD move, Shift sprint, mouse aim and fire, R reload (1.5s), 1-3/Q swap, hold E open chest, H medkit, F eat ration, G drink water (arrow keys also move). Walk over food, water, ammo and armour to collect them (ammo only for guns you carry). Aim at the centre of an enemy for an instant HEADSHOT kill (not shotguns). Sprinting drains stamina; heavy guns slow you and slow stamina recovery.</p>'}
else if(tab==='shop'){h+='<h2>Armoury</h2><div class=row><div class=card>Body Armour L'+(P.armor|0)+'/3<br>Start with +25 shield per level<br><button '+(P.armor>=3?'disabled':'')+' onclick="buy(\'armor\')">'+(P.armor>=3?'MAX':'Buy '+[250,500,900][P.armor|0]+' XP')+'</button></div><div class=card>Medkits ('+(P.kits|0)+'/5)<br>Press H: heal 60<br><button onclick="buy(\'kit\')">Buy 60 XP</button></div></div>';
for(const e in EF)h+='<h2>'+EF[e].t+'</h2><div class=row>'+['smg','ar','sg','sn','hv'].map(r=>{const id=e+':'+r,o=P.own.includes(id);return'<div class=card>'+WN[e][r]+'<br><span class=n>'+r.toUpperCase()+'</span><br>'+(o?'<button class="'+(P.sec===r&&0?'on':'')+'" onclick="P.sec=\''+r+'\';save();ui()">'+(P.sec===r?'Secondary (all eras)':'Set secondary')+'</button>':'<button onclick="buy(\''+id+'\')">'+PR[r]+' XP</button>')+'</div>'}).join('')+'</div>'}
else{h+='<h2>Leaderboard</h2><table id=lb><tr><td>Loading...</td></tr></table>';lbLoad()}
m.innerHTML=h}
function buy(w){const cost=w==='armor'?[250,500,900][P.armor|0]:w==='kit'?60:PR[w.split(':')[1]];if(P.xp<cost)return alert('Not enough XP');if(w==='kit'&&P.kits>=5)return;P.xp-=cost;if(w==='armor')P.armor++;else if(w==='kit')P.kits++;else P.own.push(w);save();ui()}
async function lbLoad(){let rows='<tr><th>#</th><th>Name</th><th>XP</th><th>Wins</th><th>Kills</th></tr>';try{if(!db)throw 0;const s=await db.collection('players').orderBy('xp','desc').limit(10).get();s.docs.forEach((d,i)=>{const v=d.data();rows+='<tr><td>'+(i+1)+'</td><td>'+String(v.n||'?').replace(/[<>&]/g,'')+'</td><td>'+(v.xp|0)+'</td><td>'+(v.wins|0)+'</td><td>'+(v.kills|0)+'</td></tr>'})}catch(e){rows+='<tr><td colspan=5>Leaderboard needs a claude.ai sign-in</td></tr>'}const t=$('#lb');if(t)t.innerHTML=rows}
/* ------- match flow ------- */
async function start(kind){ac();const nm=$('#nm');P.n=(nm&&nm.value||P.n||'Rookie'+~~(Math.random()*99)).slice(0,12);mode=kind==='prac'?$('#md').value:kind==='ffa'?'ffa':'tdm';diff=kind==='prac'?$('#df').value:'medium';save();
net=null;peers=[];if(kind!=='prac'&&room0){try{net=await room0.join('lz'+kind);wire()}catch(e){net=null}}
$('#menu').style.display='none';goVote()}
